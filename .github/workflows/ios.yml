name: ios

# Compiles the iOS app. Nothing else in CI does: the app job type-checks and
# tests the JavaScript, but a native module that no longer builds against this
# React Native, a Podfile that no longer resolves, or a JS bundle that only
# fails under the Release build phase would otherwise surface first on the
# maintainer's Mac on release day.
#
# A Release build for the Simulator, unsigned: that runs every native compile,
# every pod, and the same bundle-JS build phase a TestFlight archive runs,
# without needing a certificate in CI. Signing and upload stay on the
# maintainer's machine (ios/fastlane/Fastfile).

on:
  push:
    paths: ["app/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Recorded because the maintainer's Mac builds on a newer Xcode than
      # this runner: a pass here and a pass there are independent evidence
      # only if each says which Xcode it was.
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          {
            echo "### Toolchain"
            echo '```'
            xcodebuild -version
            echo "iphonesimulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app

      - uses: actions/cache@v4
        with:
          path: app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile', 'app/ios/Podfile.lock', 'app/package-lock.json') }}

      - name: Pod install
        working-directory: app/ios
        run: bundle exec pod install

      # Podfile.lock pins every native dependency's exact version, and until
      # one is committed CI resolves them afresh on every run. Say so loudly
      # rather than silently building something unpinned.
      - name: Podfile.lock is committed and current
        working-directory: app/ios
        run: |
          if ! git ls-files --error-unmatch Podfile.lock > /dev/null 2>&1; then
            echo "::warning::ios/Podfile.lock is not committed; this build resolved pods afresh. Commit the one below."
            cat Podfile.lock
          elif ! git diff --exit-code Podfile.lock; then
            echo "::error::pod install changed Podfile.lock; run it locally and commit the result"
            exit 1
          fi

      - name: Build (Release, Simulator, unsigned)
        working-directory: app/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Boxwright.xcworkspace \
            -scheme Boxwright \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -200
